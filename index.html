<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محلل الكاميرا الذكي 🤖</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    min-height: 100vh; color: #fff; padding: 20px;
  }
  .container { max-width: 900px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 20px; }
  header h1 { font-size: 28px; margin-bottom: 5px; }
  header p { opacity: 0.8; font-size: 14px; }

  .camera-wrapper {
    position: relative; background: #000;
    border-radius: 16px; overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    margin-bottom: 15px; aspect-ratio: 16/9;
  }
  #video {
    width: 100%; height: 100%;
    object-fit: contain; display: block; background: #000;
  }
  #canvas {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%; pointer-events: none;
  }

  .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
  button {
    flex: 1; min-width: 140px; padding: 14px 20px;
    border: none; border-radius: 12px; font-size: 16px;
    font-weight: bold; cursor: pointer; transition: all 0.3s;
  }
  .btn-primary { background: linear-gradient(135deg,#00c853,#00e676); color:#fff; }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0,200,83,0.4); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn-secondary { background: linear-gradient(135deg,#ff5252,#ff1744); color:#fff; }
  .btn-secondary:hover { transform: translateY(-2px); }
  .btn-secondary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn-icon { background: rgba(255,255,255,0.15); color:#fff; flex: 0 0 auto; min-width: auto; }
  .btn-icon:hover { background: rgba(255,255,255,0.25); }

  .status {
    background: rgba(0,0,0,0.3); padding: 12px 20px;
    border-radius: 12px; margin-bottom: 15px;
    font-size: 15px; display: flex; align-items: center; gap: 10px;
  }
  .status-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #ffb300; animation: pulse 1.5s infinite; flex-shrink: 0;
  }
  .status.ready .status-dot { background: #00e676; animation: none; }
  .status.error .status-dot { background: #ff1744; animation: none; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

  .detections {
    background: rgba(255,255,255,0.08);
    border-radius: 12px; padding: 15px 20px; min-height: 80px;
  }
  .detections h3 { font-size: 16px; margin-bottom: 10px; opacity: 0.9; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag {
    background: linear-gradient(135deg,#00c853,#00e676);
    color: #000; padding: 6px 14px; border-radius: 20px;
    font-size: 14px; font-weight: bold;
  }
  .empty { opacity: 0.5; font-size: 14px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🤖 محلل الكاميرا الذكي</h1>
    <p>افتح الكاميرا وسيتعرف الذكاء الاصطناعي على كل ما أمامك</p>
  </header>

  <div class="camera-wrapper">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="canvas"></canvas>
  </div>

  <div class="status" id="status">
    <span class="status-dot"></span>
    <span id="status-text">اضغط على "تشغيل الكاميرا" للبدء</span>
  </div>

  <div class="controls">
    <button class="btn-primary" id="startBtn">📷 تشغيل الكاميرا</button>
    <button class="btn-secondary" id="stopBtn" disabled>⏹️ إيقاف</button>
    <button class="btn-icon" id="switchBtn" title="تبديل الكاميرا">🔄</button>
  </div>

  <div class="detections">
    <h3>📋 الأشياء المكتشفة:</h3>
    <div class="tags" id="tags"><span class="empty">لا يوجد شيء بعد...</span></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script>
  const labelsAr = {
    person:'شخص', bicycle:'دراجة', car:'سيارة', motorcycle:'موتوسيكل', airplane:'طائرة',
    bus:'أتوبيس', train:'قطار', truck:'شاحنة', boat:'قارب', 'traffic light':'إشارة مرور',
    'fire hydrant':'صنبور حريق', 'stop sign':'علامة توقف', 'parking meter':'عداد مواقف',
    bench:'مقعد', bird:'طائر', cat:'قطة', dog:'كلب', horse:'حصان', sheep:'خروف',
    cow:'بقرة', elephant:'فيل', bear:'دب', zebra:'حمار وحشي', giraffe:'زرافة',
    backpack:'حقيبة ظهر', umbrella:'شمسية', handbag:'شنطة يد', tie:'كرافتة',
    suitcase:'شنطة سفر', frisbee:'قرص طائر', skis:'تزلج', snowboard:'لوح ثلج',
    'sports ball':'كرة', kite:'طائرة ورقية', 'baseball bat':'مضرب بيسبول',
    'baseball glove':'قفاز بيسبول', skateboard:'سكيت بورد', surfboard:'لوح أمواج',
    'tennis racket':'مضرب تنس', bottle:'زجاجة', 'wine glass':'كأس', cup:'كوب',
    fork:'شوكة', knife:'سكين', spoon:'ملعقة', bowl:'طبق', banana:'موزة',
    apple:'تفاحة', sandwich:'ساندويتش', orange:'برتقالة', broccoli:'بروكلي',
    carrot:'جزرة', 'hot dog':'هوت دوج', pizza:'بيتزا', donut:'دونات', cake:'كيك',
    chair:'كرسي', couch:'أريكة', 'potted plant':'نبات', bed:'سرير',
    'dining table':'طاولة طعام', toilet:'حمام', tv:'تلفاز', laptop:'لابتوب',
    mouse:'ماوس', remote:'ريموت', keyboard:'كيبورد', 'cell phone':'موبايل',
    microwave:'ميكروويف', oven:'فرن', toaster:'توستر', sink:'حوض',
    refrigerator:'ثلاجة', book:'كتاب', clock:'ساعة', vase:'مزهرية',
    scissors:'مقص', 'teddy bear':'دبدوب', 'hair drier':'سشوار', toothbrush:'فرشاة أسنان'
  };

  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const statusEl = document.getElementById('status');
  const statusText = document.getElementById('status-text');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const switchBtn = document.getElementById('switchBtn');
  const tagsEl = document.getElementById('tags');

  let model = null, isRunning = false, facingMode = 'environment', rafId = null;

  function setStatus(text, state) {
    statusText.textContent = text;
    statusEl.className = 'status' + (state ? ' ' + state : '');
  }

  async function loadModel() {
    if (model) return;
    setStatus('⏳ جاري تحميل نموذج الذكاء الاصطناعي...');
    model = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
    setStatus('✅ النموذج جاهز');
  }

  async function startCamera() {
    if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    video.srcObject = stream;
    await new Promise(r => { if (video.readyState >= 1) r(); else video.onloadedmetadata = r; });
    await video.play();
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
  }

  async function startDetection() {
    if (isRunning) return;
    startBtn.disabled = true;
    try {
      await loadModel();
      setStatus('📷 جاري تشغيل الكاميرا...');
      await startCamera();
      isRunning = true;
      stopBtn.disabled = false;
      setStatus('🟢 الكاميرا تعمل - جاري التحليل...', 'ready');
      detectLoop();
    } catch (err) {
      startBtn.disabled = false;
      if (err.name === 'NotAllowedError')
        setStatus('❌ تم رفض الوصول للكاميرا. اسمح بالوصول من المتصفح', 'error');
      else if (err.name === 'NotFoundError')
        setStatus('❌ لم يتم العثور على كاميرا', 'error');
      else if (location.protocol !== 'https:' && !['localhost','127.0.0.1'].includes(location.hostname))
        setStatus('❌ يجب استخدام HTTPS لتشغيل الكاميرا', 'error');
      else
        setStatus('❌ خطأ: ' + err.message, 'error');
    }
  }

  function stopDetection() {
    isRunning = false;
    if (rafId) cancelAnimationFrame(rafId);
    if (video.srcObject) {
      video.srcObject.getTracks().forEach(t => t.stop());
      video.srcObject = null;
    }
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    tagsEl.innerHTML = '<span class="empty">لا يوجد شيء بعد...</span>';
    startBtn.disabled = false;
    stopBtn.disabled = true;
    setStatus('⏹️ تم إيقاف الكاميرا');
  }

  async function detectLoop() {
    if (!isRunning) return;
    if (video.readyState === 4 && model) {
      try {
        const predictions = await model.detect(video, 20, 0.5);
        drawPredictions(predictions);
        updateTags(predictions);
      } catch (e) { console.error(e); }
    }
    rafId = requestAnimationFrame(detectLoop);
  }

  function drawPredictions(predictions) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    predictions.forEach(p => {
      const [x, y, w, h] = p.bbox;
      const label = labelsAr[p.class] || p.class;
      const conf = Math.round(p.score * 100);
      const text = `${label} ${conf}%`;

      ctx.strokeStyle = '#00e676';
      ctx.lineWidth = 4;
      ctx.strokeRect(x, y, w, h);

      ctx.font = 'bold ' + Math.max(16, canvas.width / 55) + 'px Arial, sans-serif';
      const metrics = ctx.measureText(text);
      const pad = 8;
      const tw = metrics.width + pad * 2;
      const th = Math.max(26, canvas.width / 42);
      let ly = y - th; if (ly < 0) ly = y;

      ctx.fillStyle = 'rgba(0,230,118,0.92)';
      ctx.fillRect(x, ly, tw, th);
      ctx.fillStyle = '#000';
      ctx.textBaseline = 'middle';
      ctx.textAlign = 'left';
      ctx.fillText(text, x + pad, ly + th / 2);
    });
  }

  function updateTags(predictions) {
    if (predictions.length === 0) {
      tagsEl.innerHTML = '<span class="empty">لا يوجد شيء مكتشف حالياً...</span>';
      return;
    }
    const map = new Map();
    predictions.forEach(p => {
      const label = labelsAr[p.class] || p.class;
      const conf = Math.round(p.score * 100);
      if (!map.has(label) || map.get(label) < conf) map.set(label, conf);
    });
    tagsEl.innerHTML = '';
    map.forEach((conf, label) => {
      const span = document.createElement('span');
      span.className = 'tag';
      span.textContent = `${label} ${conf}%`;
      tagsEl.appendChild(span);
    });
  }

  async function switchCamera() {
    facingMode = facingMode === 'environment' ? 'user' : 'environment';
    if (isRunning) { try { await startCamera(); } catch(e){ console.error(e); } }
  }

  startBtn.addEventListener('click', startDetection);
  stopBtn.addEventListener('click', stopDetection);
  switchBtn.addEventListener('click', switchCamera);

  if (location.protocol !== 'https:' && !['localhost','127.0.0.1'].includes(location.hostname)) {
    setStatus('⚠️ المتصفح يتطلب HTTPS لتشغيل الكاميرا', 'error');
  }
</script>
</body>
</html>
